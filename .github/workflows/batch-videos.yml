name: Batch Process Videos from JSON

on:
  workflow_dispatch:
  push:
    paths:
      - 'video_list.json'

jobs:
  batch-process-videos:
    name: Process multiple videos from JSON file
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: speech to text for multiple videos
        uses: ./
        with:
          model: small
          video_list_file: video_list.json
          output_format: txt,srt,csv
          output_folder: youtube
          print_segment: true
          debug: true

      - name: git push changes
        uses: appleboy/git-push-action@v0.0.3
        with:
          branch: main
          commit: true
          commit_message: "[skip ci] Upload transcriptions"
          remote: git@github.com:lianrongzhang/whisper-action.git
          ssh_key: ${{ secrets.DEPLOY_KEY }}
          rebase: true
